name: App Store release

# Manual only. Regenerates screenshots, uploads the listing, sets Free pricing and attaches the
# latest processed TestFlight build to the App Store version. It never submits for review.
on:
  workflow_dispatch:
    inputs:
      build:
        description: 'TestFlight build number to attach (blank = latest processed 1.0.0 build)'
        type: string
        default: ''
  push:
    tags: ['appstore-*']

permissions:
  contents: read

concurrency:
  group: app-store-release
  cancel-in-progress: false

jobs:
  screenshots:
    uses: ./.github/workflows/screenshots.yml

  listing:
    needs: screenshots
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
      FASTLANE_SKIP_DOCS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Check release secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          ASC_BETA_FEEDBACK_EMAIL: ${{ secrets.ASC_BETA_FEEDBACK_EMAIL }}
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT ASC_BETA_FEEDBACK_EMAIL; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret $name; see docs/RELEASE.md"
              missing=1
            fi
          done
          exit "$missing"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: app-store-screenshots
          path: fastlane/screenshots/en-US
      - name: Upload listing and screenshots, attach build (stops before Submit for Review)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          ASC_BETA_FEEDBACK_EMAIL: ${{ secrets.ASC_BETA_FEEDBACK_EMAIL }}
          ASC_REVIEW_EMAIL: ${{ secrets.ASC_REVIEW_EMAIL }}
          ASC_REVIEW_PHONE: ${{ secrets.ASC_REVIEW_PHONE }}
          BUILD: ${{ inputs.build }}
        run: bundle exec fastlane ios metadata build:"$BUILD"
