name: Core tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ startsWith(vars.MACOS_RUNNER, '[') && fromJSON(vars.MACOS_RUNNER) || vars.MACOS_RUNNER || 'macos-15' }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: ${{ vars.DEVELOPER_DIR || '/Applications/Xcode_26.2.app/Contents/Developer' }}
    steps:
      - uses: actions/checkout@v4
      - run: ruby scripts/check-release.rb
      - run: swift test
      - name: Build iOS app
        run: xcodebuild -project Still.xcodeproj -scheme Still -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
