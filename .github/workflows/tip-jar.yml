name: Tip jar

on:
  pull_request:
    paths:
      - Still/Features/Journal/TipJar.swift
      - Still/Features/Journal/JournalView.swift
      - StillUITests/TipJarTests.swift
      - Tendr.storekit
      - Still.xcodeproj/**
      - .github/workflows/tip-jar.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tip-jar:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Build for testing
        run: |
          runtime=$(xcrun simctl list runtimes --json | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="iOS" and x["isAvailable"]]; print(r[-1]["identifier"])')
          udid=$(xcrun simctl create "Tip Jar" com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro-Max "$runtime")
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b >/dev/null
          xcodebuild build-for-testing -project Still.xcodeproj -scheme Still -destination "id=$udid" \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO -quiet
      - name: Tip jar UI tests (dark and light), with screenshots
        run: |
          for appearance in dark light; do
            xcrun simctl ui "$UDID" appearance "$appearance"
            xcrun simctl status_bar "$UDID" override --time "9:41" --dataNetwork wifi --wifiMode active --wifiBars 3 \
              --cellularMode active --cellularBars 4 --operatorName "" --batteryState discharging --batteryLevel 100
            mkdir -p "build/tip-jar/$appearance"
            TEST_RUNNER_SCREENSHOT_DIR="$PWD/build/tip-jar/$appearance" xcodebuild test-without-building \
              -project Still.xcodeproj -scheme Still -destination "id=$UDID" -derivedDataPath build/DerivedData \
              -only-testing:StillUITests/TipJarTests -resultBundlePath "build/tip-jar/TipJarTests-$appearance.xcresult" 2>&1 \
              | grep -E "Test Case|error:|failed|TEST (SUCC|FAIL)" || true
            xcrun xcresulttool get test-results summary --path "build/tip-jar/TipJarTests-$appearance.xcresult" --compact \
              | python3 -c 'import json,sys; s=json.load(sys.stdin); print(s.get("result"), s.get("passedTests"), "passed", s.get("failedTests"), "failed"); [print(f.get("testName"), "-", f.get("failureText")) for f in s.get("testFailures", [])]; sys.exit(0 if s.get("result")=="Passed" else 1)'
          done
      - name: Record a purchase (dark)
        run: |
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl io "$UDID" recordVideo --codec=h264 --force build/tip-jar/tip-jar-purchase.mp4 &
          recorder=$!
          sleep 2
          xcodebuild test-without-building -project Still.xcodeproj -scheme Still -destination "id=$UDID" \
            -derivedDataPath build/DerivedData -only-testing:StillUITests/TipJarTests/testTipPurchaseCelebratesThenCloses -quiet || status=$?
          kill -INT "$recorder"
          wait "$recorder" || true
          exit "${status:-0}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tip-jar-screens
          path: |
            build/tip-jar/dark/*.png
            build/tip-jar/light/*.png
            build/tip-jar/*.mp4
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tip-jar-results
          path: build/tip-jar/*.xcresult
          if-no-files-found: ignore
