name: UI verify (temporary)
on: pull_request
permissions:
  contents: read
jobs:
  ui:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Run vial-related UI tests
        run: |
          runtime=$(xcrun simctl list runtimes --json | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x["platform"]=="iOS" and x["isAvailable"]]; print(r[-1]["identifier"])')
          udid=$(xcrun simctl create "UI Verify" com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro-Max "$runtime")
          xcodebuild test -project Still.xcodeproj -scheme Still -destination "id=$udid" CODE_SIGNING_ALLOWED=NO \
            -only-testing:StillUITests/StillUITests/testDoseAndWeightLogWithoutAVial \
            -only-testing:StillUITests/StillUITests/testPreviewScreensAndLogging \
            -only-testing:StillUITests/StillUITests/testLogDoseOnlyCreatesTakenDoses \
            -only-testing:StillUITests/StillUITests/testNewDoseHidesVialAdditionAndMedicationHeaderButEditingShowsThem \
            -only-testing:StillUITests/StillUITests/testDoseEntryIsMilligramsOnly \
            -only-testing:StillUITests/StillUITests/testHomeCardsOpenTheirOwnScreens \
            -resultBundlePath build/ui-verify.xcresult 2>&1 | grep -E "Test Case|error:|failed|passed|TEST (SUCC|FAIL)" ; exit "${PIPESTATUS[0]}"
