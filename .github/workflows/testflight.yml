name: TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_branch_release:
        description: 'Publish this selected non-main branch to TestFlight'
        type: boolean
        default: false

permissions:
  contents: read

# latest_testflight_build_number + 1 must have only one publisher at a time.
concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  beta:
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.confirm_branch_release)
    runs-on: ${{ startsWith(vars.MACOS_RUNNER, '[') && fromJSON(vars.MACOS_RUNNER) || vars.MACOS_RUNNER || 'macos-15' }}
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: ${{ vars.DEVELOPER_DIR || '/Applications/Xcode_26.2.app/Contents/Developer' }}
      FASTLANE_SKIP_UPDATE_CHECK: '1'
      FASTLANE_HIDE_CHANGELOG: '1'
      FASTLANE_SKIP_DOCS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Check release secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          ASC_BETA_FEEDBACK_EMAIL: ${{ secrets.ASC_BETA_FEEDBACK_EMAIL }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_CONTENT ASC_BETA_FEEDBACK_EMAIL BUILD_CERTIFICATE_BASE64 P12_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret $name; see docs/RELEASE.md"
              missing=1
            fi
          done
          exit "$missing"
      - name: Select release toolchain
        run: xcodebuild -version
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Install release signing assets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          umask 077
          certificate="$RUNNER_TEMP/tendr-signing.p12"
          keychain="$RUNNER_TEMP/tendr-signing.keychain-db"
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$keychain_password" "$keychain"
          # Add to the search list rather than replacing it, so a self-hosted Mac keeps its own keychains.
          security list-keychains -d user | xargs > "$RUNNER_TEMP/tendr-keychains-before"
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$keychain" $(cat "$RUNNER_TEMP/tendr-keychains-before")
      - name: Test, upload, and distribute to Owner Preview
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          ASC_BETA_FEEDBACK_EMAIL: ${{ secrets.ASC_BETA_FEEDBACK_EMAIL }}
        run: bundle exec fastlane ios beta changelog:"Build from $GITHUB_REF_NAME ($GITHUB_SHA)"
      - name: Remove release signing assets
        if: always()
        run: |
          keychain="$RUNNER_TEMP/tendr-signing.keychain-db"
          if [[ -f "$RUNNER_TEMP/tendr-keychains-before" ]]; then
            # shellcheck disable=SC2046
            security list-keychains -d user -s $(cat "$RUNNER_TEMP/tendr-keychains-before")
            rm -f "$RUNNER_TEMP/tendr-keychains-before"
          fi
          if [[ -f "$keychain" ]]; then
            security delete-keychain "$keychain"
          fi
          if [[ -f "$RUNNER_TEMP/tendr.mobileprovision" ]]; then
            security cms -D -i "$RUNNER_TEMP/tendr.mobileprovision" > "$RUNNER_TEMP/tendr-profile.plist"
            profile_uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/tendr-profile.plist")
            [[ "$profile_uuid" =~ ^[A-Fa-f0-9-]{36}$ ]]
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$profile_uuid.mobileprovision"
          fi
          rm -f "$RUNNER_TEMP/tendr-signing.p12" "$RUNNER_TEMP/tendr.mobileprovision" "$RUNNER_TEMP/tendr-profile.plist"
